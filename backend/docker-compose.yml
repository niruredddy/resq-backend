services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: disaster-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: disaster_mgmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - disaster_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  disaster_postgis_data: